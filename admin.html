<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Pindrop Miles admin</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFDF8;--navy:#17337E;--amber:#F5A94A;--teal:#4BB3BF;--ink:#1d2a4d;--mute:#5d6786;--line:#d9e0e8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.box{max-width:760px;margin:0 auto;padding:18px}
.gate{max-width:380px;margin:12vh auto 0;padding:24px 20px;text-align:center}
.gate img{width:72px;margin-bottom:6px}
h1{font:700 26px Lexend,sans-serif;color:var(--navy);margin:0 0 8px}
h2{font:700 18px Lexend,sans-serif;color:var(--navy);margin:0 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
.row>*{flex:1 1 150px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
button{font:600 14px Figtree,sans-serif;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button.del{flex:0 0 auto;color:#b3261e}
button.lnk{border:0;background:none;color:var(--navy);text-decoration:underline;padding:6px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper);padding:12px 0;border-top:1px solid var(--line)}
.note{color:var(--mute);font-size:14px}
.err{color:#b3261e;font-size:14px;min-height:1.4em;margin:6px 0}
.ok{color:#1b7f4b;font-weight:600;font-size:14px}
.info{background:#e6f4f6;border:1px solid var(--teal);border-radius:10px;padding:10px;font-size:14px;text-align:left}
</style>
</head>
<body>
<div id="gate" class="gate"></div>
<div id="app" class="box" hidden></div>
<script type="module" src="firebase-config.js"></script>


</body>
</html>
